name: Exact certificate verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Python 3.10
            os: ubuntu-latest
            python: "3.10"
          - name: Ubuntu / Python 3.13
            os: ubuntu-latest
            python: "3.13"
          - name: Windows / Python 3.12
            os: windows-latest
            python: "3.12"
          - name: macOS / Python 3.12
            os: macos-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Verify original R9 certificate
        run: python verify.py CERTIFICATE.json

      - name: Confirm original R9 reference output
        run: >-
          python -c "import pathlib, subprocess, sys;
          actual=subprocess.check_output([sys.executable, 'verify.py',
          'CERTIFICATE.json'], text=True).replace('\r\n', '\n');
          expected=pathlib.Path('EXPECTED_OUTPUT.txt').read_text(encoding='utf-8').replace('\r\n',
          '\n'); raise SystemExit(0 if actual == expected else 1)"

      - name: Verify retained R16 certificate and baseline
        run: python certificates/r16/verify.py

      - name: Confirm retained R16 reference output
        run: >-
          python -c "import pathlib, subprocess, sys;
          actual=subprocess.check_output([sys.executable,
          'certificates/r16/verify.py'], text=True).replace('\r\n', '\n');
          expected=pathlib.Path('certificates/r16/EXPECTED_OUTPUT.json').read_text(encoding='utf-8').replace('\r\n', '\n');
          raise SystemExit(0 if actual == expected else 1)"

      - name: Verify all seven two-sided certificates and exact expected results
        run: python -I -S certificates/two_sided/verify.py --all

      - name: Run standard-library public checker rejection and compatibility tests
        run: python -I -S tests/test_two_sided_public.py

      - name: Cross-check recovered m1024 certificate and fixed benchmark exactly
        run: python -I -S certificates/two_sided_recovery/verify.py

      - name: Run standard-library recovery package acceptance and rejection tests
        run: python -I -S tests/test_two_sided_recovery_public.py

      - name: Verify symmetric certificate and stronger bound exactly
        run: python -I -S certificates/symmetric/verify.py

      - name: Run symmetric package acceptance and rejection tests
        run: python -I -S tests/test_symmetric_public.py

      - name: Verify finite-grid symmetric certificate and stronger bound exactly
        run: python -I -S certificates/finite_grid/verify.py

      - name: Run finite-grid compact witness acceptance and rejection tests
        run: python -I -S tests/test_finite_grid_public.py

      - name: Run finite-grid actual-array acceptance and rejection tests
        run: python -I -S tests/test_finite_grid_arrays_public.py
